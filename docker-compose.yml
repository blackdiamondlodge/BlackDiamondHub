version: "3.8"

services:
  djangoapp:
    # Use the Docker image you’ve published to GHCR (or Docker Hub, etc.)
    image: ghcr.io/blackdiamondlodge/blackdiamondhub/blackdiamondhub:latest
    container_name: BlackDiamondHub
    # Pass environment variables (secrets) to Django
    environment:
      # Django core (DJANGO_SECRET_KEY is required; DJANGO_DEBUG defaults to off)
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      HOST: ${HOST}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Spotify API credentials
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

      # Wifi app settings (bdh-app-wifi)
      WIFI_NETWORKS_AUTH: ${WIFI_NETWORKS_AUTH}
      WIFI_NETWORKS_PUBLIC: ${WIFI_NETWORKS_PUBLIC}

      WIFI_PASSWORD_FOR_BDL: ${WIFI_PASSWORD_FOR_BDL}
      WIFI_PASSWORD_FOR_BDL_TO_MI: ${WIFI_PASSWORD_FOR_BDL_TO_MI}
      WIFI_PASSWORD_FOR_BDL_GUEST: ${WIFI_PASSWORD_FOR_BDL_GUEST}

      # Home Assistant Settings
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL}
      HOMEASSISTANT_ACCESS_TOKEN: ${HOMEASSISTANT_ACCESS_TOKEN}

      # Home Assistant Settings 2
      HOMEASSISTANT_URL_2: ${HOMEASSISTANT_URL_2}
      HOMEASSISTANT_ACCESS_TOKEN_2: ${HOMEASSISTANT_ACCESS_TOKEN_2}

      # Owner visits: hub acts as signed in as this non-staff user (blank = off)
      HUB_OWNER_VISIT_USER: ${HUB_OWNER_VISIT_USER:-}

      # Napoleon fireplaces (Ayla cloud)
      NAPOLEON_EMAIL: ${NAPOLEON_EMAIL:-}
      NAPOLEON_PASSWORD: ${NAPOLEON_PASSWORD:-}
      NAPOLEON_EUROPE: ${NAPOLEON_EUROPE:-}

      # Restaurants app: Google Places API (New) key; blank = no fetching
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}

      # go2rtc API URL for server-side calls. Django uses host networking,
      # so this must be http://localhost:1984 (the "go2rtc" hostname only
      # resolves inside the compose bridge network).
      GO2RTC_URL: ${GO2RTC_URL}
      # go2rtc public URL (browser-accessible, for video streams)
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL}

      # UniFi Protect API (for camera discovery)
      UNIFI_PROTECT_HOST_1: ${UNIFI_PROTECT_HOST_1}
      UNIFI_PROTECT_API_KEY_1: ${UNIFI_PROTECT_API_KEY_1}
      UNIFI_PROTECT_NAME_1: ${UNIFI_PROTECT_NAME_1}
      UNIFI_PROTECT_HOST_2: ${UNIFI_PROTECT_HOST_2}
      UNIFI_PROTECT_API_KEY_2: ${UNIFI_PROTECT_API_KEY_2}
      UNIFI_PROTECT_NAME_2: ${UNIFI_PROTECT_NAME_2}
      # View-only Protect local user (private API: events, recordings)
      BDH_CAMERAS_PROTECT_USERNAME_1: ${BDH_CAMERAS_PROTECT_USERNAME_1:-}
      BDH_CAMERAS_PROTECT_PASSWORD_1: ${BDH_CAMERAS_PROTECT_PASSWORD_1:-}
      BDH_CAMERAS_PROTECT_USERNAME_2: ${BDH_CAMERAS_PROTECT_USERNAME_2:-}
      BDH_CAMERAS_PROTECT_PASSWORD_2: ${BDH_CAMERAS_PROTECT_PASSWORD_2:-}

      # Sonos discovery interface (needed with host networking)
      SONOS_INTERFACE: ${SONOS_INTERFACE:-}
      # Sonos night volume limit status (appdaemon-sonos-night)
      BDH_SONOS_CONTROL_NIGHT_URL: ${BDH_SONOS_CONTROL_NIGHT_URL:-}

      # Gemstone Lights (AWS Amplify cloud)
      GEMSTONE_EMAIL: ${GEMSTONE_EMAIL}
      GEMSTONE_PASSWORD: ${GEMSTONE_PASSWORD}

      # bdl_modes AppDaemon app (vacation / preheat / home)
      BDL_MODES_URL: ${BDL_MODES_URL:-}
      BDL_MODES_API_KEY: ${BDL_MODES_API_KEY:-}
      BDL_MODES_PREHEAT: ${BDL_MODES_PREHEAT:-false}

      # bdl_shuttle AppDaemon app (bus reminders on the dining room Sonos)
      BDH_SHUTTLE_REMINDERS_URL: ${BDH_SHUTTLE_REMINDERS_URL:-}
      BDH_SHUTTLE_REMINDERS_API_KEY: ${BDH_SHUTTLE_REMINDERS_API_KEY:-}

    network_mode: host

    volumes:
      # Database backups taken by the entrypoint before migrations run.
      - ./backups:/backups
      # Uploaded files (inventory images, screensaver photos). Without this
      # they live in the container and are lost on every image update.
      - ./media:/app/media
    
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml
    ports:
      - "1984:1984"   # API / WebUI
      - "8555:8555/tcp" # WebRTC (TCP)
      - "8555:8555/udp" # WebRTC (UDP)
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    # Mount the Docker socket so Watchtower can manage containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # If you want Watchtower to watch only your "djangoapp" container:
    command: ["BlackDiamondHub"]
    # If your Docker registry is private, provide credentials:
    environment:
    #   WATCHTOWER_USERNAME: "${REGISTRY_USERNAME}"
    #   WATCHTOWER_PASSWORD: "${REGISTRY_PASSWORD}"
      - WATCHTOWER_POLL_INTERVAL=300
      # Delete the old image after each update, otherwise every build is
      # kept and the disk fills up (homehub hit 100% with 88 images).
      - WATCHTOWER_CLEANUP=true
    # 
    # Keep watchtower running unless it crashes/restarts
    restart: unless-stopped
