# Read at startup by hub/site.py. Brand paths are relative to this folder.
# No monogram set: the hub uses the default BDH monogram from bdh-sdk.

[brand]
name = "Slivinski Hub"
subtitle = "Mercer Island"
og_image = "brand/og-image.png"  # link-preview card (tools/render_og_image.py)

[location]  # for the screensaver's season, night mode and sunrise/sunset
latitude = 47.571
longitude = -122.222
timezone = "America/Los_Angeles"

[features]
mountain_weather = false

# Per-app settings, read by each app as BDH_<APP>_<KEY> (the Settings page and
# the environment still win). See each app's README.
[apps.sonos_control]
models = "*"  # every Sonos
presets = [
    { id = "kitchen_deck", label = "Kitchen + Deck", icon = "fa-utensils", rooms = ["Kitchen", "Deck"] },
    { id = "all", label = "Everywhere", icon = "fa-house", rooms = "*" },
]

# No floors: the room picker is a plain grid. Keys are Sonos room names.
[apps.sonos_control.rooms]
"Family Room" = { icon = "fa-tv" }
"Kitchen" = { icon = "fa-utensils" }
"Deck" = { icon = "fa-tree" }
"Living Room" = { icon = "fa-couch" }
