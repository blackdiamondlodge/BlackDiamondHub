name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
          pip install --upgrade pip
          pip install -r requirements.txt
          # Apps installed into the Sun Peaks image (see Dockerfile).
          pip install --require-hashes --no-deps -r sites/sunpeaks/apps.txt

    - name: Run Unit Tests
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        ALLOWED_HOSTS: localhost
        DJANGO_SECRET_KEY: ci-test-only
        DB_NAME: test_db
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgres
      run: |
        python manage.py hub_smoke
        python manage.py test --exclude-tag=selenium -v 2

  selenium-tests:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Start go2rtc
      run: |
        mkdir -p /tmp/go2rtc
        printf 'api:\n  listen: ":1984"\n  origin: "*"\nwebrtc:\n  listen: ":8555"\n' > /tmp/go2rtc/go2rtc.yaml
        docker run -d --name go2rtc \
          -p 1984:1984 -p 8555:8555 \
          -v /tmp/go2rtc:/config \
          alexxit/go2rtc
        for i in $(seq 1 30); do
          if curl -sf http://localhost:1984/api/streams > /dev/null 2>&1; then
            echo "go2rtc is ready"
            break
          fi
          echo "Waiting for go2rtc... ($i)"
          sleep 1
        done

    - name: Install Chrome and ChromeDriver
      run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb libxi6 libgconf-2-4
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          # Install Google Chrome
          sudo apt-get install -y google-chrome-stable
          # Fetch the installed Chrome version
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          # Fetch the matching ChromeDriver version from the JSON file
          CHROMEDRIVER_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json | jq -r --arg CHROME_VERSION "$CHROME_VERSION" '.versions[] | select(.version | startswith($CHROME_VERSION)) | .downloads.chromedriver[] | select(.platform == "linux64").url')
          # Download and install ChromeDriver
          wget -N $CHROMEDRIVER_VERSION -P ~/
          unzip ~/chromedriver-linux64.zip -d ~/
          sudo mv -f ~/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chown root:root /usr/local/bin/chromedriver
          sudo chmod 0755 /usr/local/bin/chromedriver
          # Install libzbar shared library
          sudo apt-get install libzbar0

    - name: Install Python dependencies
      run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --require-hashes --no-deps -r sites/sunpeaks/apps.txt

    - name: Run Selenium Tests (with retry)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 15
        max_attempts: 2
        command: |
          python manage.py test --tag=selenium -v 2
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        ALLOWED_HOSTS: localhost
        DJANGO_SECRET_KEY: ci-test-only
        DB_NAME: test_db
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgres
        GO2RTC_URL: http://localhost:1984

    - name: Upload screenshot on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshot
        path: "**/*.png"

  image-smoke-test:
    # Build the production image and boot it the way homehub does:
    # entrypoint backup + migrate, Daphne, WhiteNoise static, health check.
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build image
      run: docker build -t bdh-smoke .

    - name: Start container
      run: |
        mkdir -p /tmp/bdh-backups
        docker run -d --name bdh --network host \
          -e DJANGO_SECRET_KEY=smoke-test-only \
          -e ALLOWED_HOSTS=localhost \
          -e DB_HOST=localhost -e DB_NAME=smoke_db \
          -e DB_USER=postgres -e DB_PASSWORD=postgres \
          -v /tmp/bdh-backups:/backups \
          bdh-smoke

    - name: Wait for healthy container
      run: |
        for i in $(seq 1 60); do
          status=$(docker inspect -f '{{.State.Health.Status}}' bdh 2>/dev/null || echo missing)
          echo "health: $status"
          [ "$status" = "healthy" ] && exit 0
          [ "$(docker inspect -f '{{.State.Running}}' bdh)" = "true" ] || break
          sleep 5
        done
        docker logs bdh
        exit 1

    - name: Check pages, static files and the pre-migration backup
      run: |
        set -e
        curl -fsS http://localhost:8000/healthz
        curl -fsS -H 'Host: localhost' http://localhost:8000/ | grep -q 'hub-sections'
        curl -fsS -H 'Host: localhost' -o /dev/null http://localhost:8000/accounts/login/
        curl -fsS -H 'Host: localhost' -o /dev/null http://localhost:8000/static/wifi/hub/icon.svg
        # Site apps from sites/sunpeaks/apps.txt are installed in the image.
        curl -fsS -H 'Host: localhost' http://localhost:8000/wifi/ | grep -q 'WiFi Networks'
        # DEBUG must be off in the image: unknown URLs give the plain 404 page.
        ! curl -sS -H 'Host: localhost' http://localhost:8000/no-such-page/ | grep -q 'URLconf'
        ls -l /tmp/bdh-backups
        ls /tmp/bdh-backups/*.sql.gz
        docker logs bdh 2>&1 | grep -q 'backup written'

    - name: Container logs
      if: always()
      run: docker logs bdh || true