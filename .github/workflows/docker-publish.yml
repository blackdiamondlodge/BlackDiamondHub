name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ]  # or any other branches you want to build on
  # You can also add tags: [ "*" ] for building on any git tag.

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # Both sites share base layers; pushing them to the same GHCR repo in
      # parallel races on blob uploads ("unknown blob"), so build one at a time.
      max-parallel: 1
      matrix:
        # One image per site (sites/<site>/). Sun Peaks also owns :latest and the
        # bare :sha-<commit> tag, which homehub's Watchtower and rollbacks use.
        include:
          - site: sunpeaks
            tags: |
              latest
              sunpeaks
              sha-${{ github.sha }}
          - site: mercerisland
            tags: |
              mercerisland
              sha-${{ github.sha }}-mercerisland
    permissions:
      contents: read
      packages: write
    
    steps:
      # 1. Check out the repo code
      - name: Check out code
        uses: actions/checkout@v7

      # 2. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set a lowercase repository name in an environment variable
      - name: Convert repository name to lowercase
        id: set_repo
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV          

      # 4. Prefix the site's tags with the image name
      - name: Image tags
        env:
          SITE_TAGS: ${{ matrix.tags }}
        run: |
          {
            echo 'TAGS<<EOF'
            echo "$SITE_TAGS" | sed '/^$/d; s|^|ghcr.io/'"$REPO"'/blackdiamondhub:|'
            echo EOF
          } >> "$GITHUB_ENV"

      # 5. Build and push the Docker image using the lowercase repository name
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # GHCR intermittently rejects pushes that include attestation manifests.
          provenance: false
          build-args: HUB_SITE=${{ matrix.site }}
          tags: |
            ${{ env.TAGS }}
